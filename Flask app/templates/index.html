<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>MeFlix</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon-32x32.png">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

</head>
<body>
    <header class="site-header">
        <div class="header-left">
            <a href="/"><img class="site-header-image" src="/static/notnpo.png" alt="Site header logo"></a>
            <nav>
                <ul class="site-nav-list-links">
                    <li><a href="/about">About</a></li>
                    <li><a href="https://github.com/megames074HE">Git</a></li>
                </ul>
            </nav>
        </div>
        <div class="site-right">
            <nav>
                <ul class="site-nav-list-login">
                    <li class="">
                        <a href="/login"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M234-276q51-39 114-61.5T480-360q69 0 132 22.5T726-276q35-41 54.5-93T800-480q0-133-93.5-226.5T480-800q-133 0-226.5 93.5T160-480q0 59 19.5 111t54.5 93Zm146.5-204.5Q340-521 340-580t40.5-99.5Q421-720 480-720t99.5 40.5Q620-639 620-580t-40.5 99.5Q539-440 480-440t-99.5-40.5ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm100-95.5q47-15.5 86-44.5-39-29-86-44.5T480-280q-53 0-100 15.5T294-220q39 29 86 44.5T480-160q53 0 100-15.5ZM523-537q17-17 17-43t-17-43q-17-17-43-17t-43 17q-17 17-17 43t17 43q17 17 43 17t43-17Zm-43-43Zm0 360Z"></path></svg><span>login</span></a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="index-main">
        <h1>Welcome to MeFlix</h1>
        <div class="index-main-content">
            <div class="trending-container">
                <h2>Trending:</h2>
                <div class="trending">
                    <a href="/programs?slug={{ post_data['items']['trending_programs']['slug'][0] }}">
                        <img class="trending-image" src="{{ post_data['items']['trending_programs']['image'][0] }}?dimensions=3400x3400" alt="left-trending-cover">
                        <div class="trending-overlay"></div>
                        <div class="trending-overlay-image">
                            <img class="trending-image-text" src="{{ post_data['items']['trending_programs']['text_image'][0] }}?dimensions=256x256" alt="left-trending-title-text">
                        </div>
                    </a>
                </div>
            </div>
            <div class="trending-container-1">
                <h2>Trending:</h2>
                <div class="trending">
                    <a href="/programs?slug={{ post_data['items']['trending_programs']['slug'][1] }}">
                        <img class="trending-image" src="{{ post_data['items']['trending_programs']['image'][1] }}?dimensions=3400x3400" alt="Right-trending-cover">
                        <div class="trending-overlay"></div>
                        <div class="trending-overlay-image">
                            <img class="trending-image-text" src="{{ post_data['items']['trending_programs']['text_image'][1] }}?dimensions=256x256" alt="right-trending-title-text">
                        </div>
                    </a>
                </div>
            </div>
            <div class="middle-main-content">
                <form class="form" action="/search_results" method="post">
                    <label for="series-input" aria-label="form-search-npoprogram"></label>
                    <input type="text" id="series-input" name="search-term" placeholder="Enter program to search for:">
                    <button type="submit" aria-label="button-search-npoprogram-form-submit">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"></path></svg>
                    </button>
                </form>
                <h2>New Programs:</h2>
                <div class="new-programs-container">
                    <div class="new-program">
                        <a href="/programs?slug={{ post_data['items']['new_programs']['slug'][0] }}">
                            <img class="new-program-image" src="{{ post_data['items']['new_programs']['image'][0] }}?dimensions=900x900" alt="new-program-image1">
                            <div class="new-program-overlay"></div>
                            <div class="new-program-overlay-image">
                                <img class="new-program-image-text" src="{{ post_data['items']['new_programs']['text_image'][0] }}?dimensions=128x128" alt="title-text-logo1">
                            </div>
                        </a>
                    </div>
                    <div class="new-program">
                        <a href="/programs?slug={{ post_data['items']['new_programs']['slug'][1] }}">
                            <img class="new-program-image" src="{{ post_data['items']['new_programs']['image'][1] }}?dimensions=900x900" alt="new-program-image2">
                            <div class="new-program-overlay"></div>
                            <div class="new-program-overlay-image">
                                <img class="new-program-image-text" src="{{ post_data['items']['new_programs']['text_image'][1] }}?dimensions=128x128" alt="title-text-logo2">
                            </div>
                        </a>
                    </div>
                    <div class="new-program">
                        <a href="/programs?slug={{ post_data['items']['new_programs']['slug'][2] }}">
                            <img class="new-program-image" src="{{ post_data['items']['new_programs']['image'][2] }}?dimensions=900x900" alt="new-program-image3">
                            <div class="new-program-overlay"></div>
                            <div class="new-program-overlay-image">
                                <img class="new-program-image-text" src="{{ post_data['items']['new_programs']['text_image'][2] }}?dimensions=128x128" alt="title-text-logo3">
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="main-footer">
        <h2>Created By Megames: <a href="https://megames.se">megames.se</a></h2>
    </footer>
</body>
</html>
